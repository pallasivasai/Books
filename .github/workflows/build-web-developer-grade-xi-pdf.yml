name: Build Web Developer Grade XI PDF

on:
  push:
    paths:
      - 'Web developer-11th/**'
      - '.github/workflows/build-web-developer-grade-xi-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-developer-grade-xi-pdf
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download licensed textbook photographs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "Web developer-11th/images"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Woman_sitting_in_her_workspace_and_typing_on_laptop.jpg" -o "Web developer-11th/images/web-developer-workspace.jpg"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Website%20Coding.jpg" -o "Web developer-11th/images/html-coding.jpg"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Responsive-web-design-devices.jpg" -o "Web developer-11th/images/responsive-devices.jpg"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Programming_code.jpg" -o "Web developer-11th/images/programming-code.jpg"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/ComputerProgrammer.jpg" -o "Web developer-11th/images/programmer-work.jpg"
          file Web\ developer-11th/images/*
          cat > "Web developer-11th/IMAGE-CREDITS.txt" <<'EOF'
          Image credits and licences
          1. web-developer-workspace.jpg — Shixart1985, Wikimedia Commons, CC BY 2.0.
             https://commons.wikimedia.org/wiki/File:Woman_sitting_in_her_workspace_and_typing_on_laptop.jpg
          2. html-coding.jpg — hackNY / Matylda, Wikimedia Commons, CC BY-SA 2.0.
             https://commons.wikimedia.org/wiki/File:Website_Coding.jpg
          3. responsive-devices.jpg — Muhammad Rafizeldi, Wikimedia Commons, CC BY-SA 3.0.
             https://commons.wikimedia.org/wiki/File:Responsive-web-design-devices.jpg
          4. programming-code.jpg — Martin Vorel, Wikimedia Commons, CC BY-SA 4.0.
             https://commons.wikimedia.org/wiki/File:Programming_code.jpg
          5. programmer-work.jpg — Free-Photos / Pixabay, Wikimedia Commons, CC0 1.0.
             https://commons.wikimedia.org/wiki/File:ComputerProgrammer.jpg
          EOF
      - name: Compile Web Developer Grade XI textbook
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: 'Web developer-11th'
          latexmk_use_xelatex: true
      - name: Package Overleaf-ready source and images
        shell: bash
        run: |
          cd "Web developer-11th"
          cat > README-OVERLEAF.txt <<'EOF'
          Overleaf import instructions
          1. Upload this ZIP to Overleaf using New Project > Upload Project.
          2. Set main.tex as the main document if Overleaf does not detect it.
          3. Compile with XeLaTeX.
          4. The images/ folder and IMAGE-CREDITS.txt are included.
          5. Internet access is not needed to compile once the project is uploaded.
          EOF
          zip -r "../Web-Developer-Grade-XI-Overleaf-Source.zip" main.tex images IMAGE-CREDITS.txt README-OVERLEAF.txt
      - name: Upload Overleaf source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Web-Developer-Grade-XI-Overleaf-Source
          path: 'Web-Developer-Grade-XI-Overleaf-Source.zip'
          if-no-files-found: error
          retention-days: 30
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Developer-Grade-XI-PDF
          path: 'Web developer-11th/main.pdf'
          if-no-files-found: error
          retention-days: 30
