name: Build Web Developer Grade XI PDF

on:
  push:
    paths:
      - 'Web developer-11th/**'
      - '.github/workflows/build-web-developer-grade-xi-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-developer-grade-xi-pdf
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download licensed textbook photographs
        shell: bash
        run: |
          mkdir -p "Web developer-11th/images"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Woman_sitting_in_her_workspace_and_typing_on_laptop.jpg" -o "Web developer-11th/images/web-developer-workspace.jpg"
          file "Web developer-11th/images/web-developer-workspace.jpg"
      - name: Compile Web Developer Grade XI textbook
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: 'Web developer-11th'
          latexmk_use_xelatex: true
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Developer-Grade-XI-PDF
          path: 'Web developer-11th/main.pdf'
          if-no-files-found: error
          retention-days: 30
