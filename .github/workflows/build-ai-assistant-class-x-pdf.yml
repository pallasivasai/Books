name: Build AI Assistant Grade X PDF

on:
  push:
    paths:
      - 'Artificial intelligence assistant-10th/**'
      - '.github/workflows/build-ai-assistant-class-x-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest pending build for this textbook.
concurrency:
  group: ai-assistant-grade-x-pdf
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile AI Assistant Grade X textbook
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: 'Artificial intelligence assistant-10th'
          latexmk_use_xelatex: true
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artificial-Intelligence-Assistant-Grade-X-PDF
          path: 'Artificial intelligence assistant-10th/main.pdf'
          if-no-files-found: error
          retention-days: 30
