name: Build Class X Book PDF

on:
  push:
    paths:
      - 'Domestic data entry operator-10th/**'
      - '.github/workflows/build-class-x-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile LaTeX book
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: 'Domestic data entry operator-10th'
          latexmk_use_xelatex: true
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Domestic-Data-Entry-Operator-Class-X-PDF
          path: 'Domestic data entry operator-10th/main.pdf'
          if-no-files-found: error
          retention-days: 30
