name: Build Class X Book PDF

on:
  push:
    paths:
      - 'Domestic data entry operator-10th/**'
      - '.github/workflows/build-class-x-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python for diagrams
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagram dependency
        run: python -m pip install --upgrade Pillow
      - name: Generate topic diagrams
        working-directory: 'Domestic data entry operator-10th'
        run: python make_diagrams.py
      - name: Verify required diagrams exist
        working-directory: 'Domestic data entry operator-10th'
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'book_illustrations/spreadsheet_formula.png',
              'book_illustrations/macro_safety.png',
              'book_illustrations/query_process.png',
              'book_illustrations/data_quality_check.png',
              'book_illustrations/emergency_preparedness.png',
          ]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit('Missing generated diagrams: ' + ', '.join(missing))
          print('All required Class X diagrams are present.')
          PY
      - name: Compile LaTeX book
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: 'Domestic data entry operator-10th'
          latexmk_use_xelatex: true
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Domestic-Data-Entry-Operator-Class-X-PDF
          path: 'Domestic data entry operator-10th/main.pdf'
          if-no-files-found: error
          retention-days: 30
